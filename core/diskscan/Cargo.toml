[package]
name = "diskscan"
description = "Parallel disk-usage scanning, categorisation, duplicate detection, and layout for DiskLens"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "diskscan"
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
blake3 = "1.5"
jwalk = "0.8"
libc = "0.2"
rayon = "1.10"
thiserror = "1"
uniffi = { version = "0.32.2", features = ["cli"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
