name: DiskLens
options:
  bundleIdPrefix: com.disklens
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  ALWAYS_SEARCH_USER_PATHS: NO
  SWIFT_VERSION: "5.0"
  SWIFT_STRICT_CONCURRENCY: minimal
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  MARKETING_VERSION: "0.1.0"
  CURRENT_PROJECT_VERSION: "1"
  DISKLENS_RELEASE_CHANNEL: alpha
  # Ad-hoc ("Sign to Run Locally"). No Apple Developer team is required
  # to build, test, or launch on this Mac. Notarization still needs a team.
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: "-"
  DEVELOPMENT_TEAM: ""
  CODE_SIGNING_REQUIRED: YES
  CODE_SIGNING_ALLOWED: YES
  ENABLE_HARDENED_RUNTIME: YES
targets:
  DiskLens:
    type: application
    platform: macOS
    sources:
      - path: DiskLens
      - path: Generated/diskscan.swift
    dependencies:
      - framework: Vendor/DiskScanFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: DiskLens
        PRODUCT_MODULE_NAME: DiskLens
        PRODUCT_BUNDLE_IDENTIFIER: com.disklens.DiskLens
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DiskLens/Info.plist
        CODE_SIGN_ENTITLEMENTS: DiskLens/DiskLens.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
  DiskLensStore:
    type: application
    platform: macOS
    sources:
      - path: DiskLens
      - path: Generated/diskscan.swift
    dependencies:
      - framework: Vendor/DiskScanFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: DiskLensStore
        PRODUCT_BUNDLE_IDENTIFIER: com.disklens.DiskLens
        PRODUCT_MODULE_NAME: DiskLensStore
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DiskLens/Info.plist
        CODE_SIGN_ENTITLEMENTS: DiskLens/DiskLensStore.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DISKLENS_SANDBOX
  DiskLensTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DiskLensTests
    dependencies:
      - target: DiskLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.disklens.DiskLensTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DiskLens.app/Contents/MacOS/DiskLens"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.0"
  DiskLensStoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DiskLensTests
    dependencies:
      - target: DiskLensStore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.disklens.DiskLensStoreTests
        PRODUCT_MODULE_NAME: DiskLensStoreTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DiskLensStore.app/Contents/MacOS/DiskLensStore"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DISKLENS_SANDBOX
        SWIFT_VERSION: "5.0"
schemes:
  DiskLens:
    build:
      targets:
        DiskLens: all
        DiskLensTests: [test]
    test:
      targets:
        - DiskLensTests
    run:
      config: Debug
  DiskLensStore:
    build:
      targets:
        DiskLensStore: all
        DiskLensStoreTests: [test]
    test:
      targets:
        - DiskLensStoreTests
    run:
      config: Debug
