name: DiskLens
options:
  bundleIdPrefix: com.disklens
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  SWIFT_VERSION: "5.0"
  SWIFT_STRICT_CONCURRENCY: minimal
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
  CODE_SIGN_STYLE: Automatic
  ENABLE_HARDENED_RUNTIME: YES
targets:
  DiskLens:
    type: application
    platform: macOS
    sources:
      - path: DiskLens
      - path: Generated/diskscan.swift
    dependencies:
      - framework: Vendor/DiskScanFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.disklens.DiskLens
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DiskLens/Info.plist
        CODE_SIGN_ENTITLEMENTS: DiskLens/DiskLens.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    info:
      path: DiskLens/Info.plist
  DiskLensStore:
    type: application
    platform: macOS
    sources:
      - path: DiskLens
      - path: Generated/diskscan.swift
    dependencies:
      - framework: Vendor/DiskScanFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_NAME: DiskLensStore
        PRODUCT_BUNDLE_IDENTIFIER: com.disklens.DiskLens
        PRODUCT_MODULE_NAME: DiskLensStore
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DiskLens/Info.plist
        CODE_SIGN_ENTITLEMENTS: DiskLens/DiskLensStore.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DISKLENS_SANDBOX
    info:
      path: DiskLens/Info.plist
  DiskLensTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DiskLensTests
    dependencies:
      - target: DiskLens
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.disklens.DiskLensTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/DiskLens.app/Contents/MacOS/DiskLens"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.0"
schemes:
  DiskLens:
    build:
      targets:
        DiskLens: all
        DiskLensTests: [test]
    test:
      targets:
        - DiskLensTests
    run:
      config: Debug
  DiskLensStore:
    build:
      targets:
        DiskLensStore: all
    run:
      config: Debug
